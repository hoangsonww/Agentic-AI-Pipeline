# =============================================================================
# Pod Security — Agentic AI
# Enforces least-privilege security context for all pods.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: agentic-ai
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agentic-ai-quota
  namespace: agentic-ai
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: agentic-ai-limits
  namespace: agentic-ai
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 2Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 50m
        memory: 64Mi
    - type: Pod
      max:
        cpu: "4"
        memory: 8Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-ai
  namespace: agentic-ai
  annotations:
    # AWS EKS IRSA (uncomment and set ARN)
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/agentic-ai
    # GKE Workload Identity (uncomment and set)
    # iam.gke.io/gcp-service-account: agentic-ai@PROJECT.iam.gserviceaccount.com
automountServiceAccountToken: false
