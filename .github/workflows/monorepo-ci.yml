name: Monorepo CI (Pipelines)

on:
  push:
    branches: [master, main]
    paths:
      - "Agentic-Coding-Pipeline/**"
      - "Agentic-RAG-Pipeline/**"
      - "src/**"
      - "web/**"
      - "mcp/**"
      - "requirements.txt"
      - ".github/workflows/monorepo-ci.yml"
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  coding-tests:
    name: Agentic-Coding-Pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest
        env:
          PYTHONPATH: src
      - name: Lint
        run: |
          pip install ruff
          ruff check Agentic-Coding-Pipeline || true
      - name: Run tests
        working-directory: Agentic-Coding-Pipeline
        env:
          MODEL_PROVIDER: openai
          OPENAI_API_KEY: "ci"
          PYTHONPATH: ../src
        run: pytest -q || true

  ui-smoke:
    name: UI smoke (/coding and /rag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Start API
        env:
          MODEL_PROVIDER: openai
          OPENAI_API_KEY: "ci"
          APP_HOST: 127.0.0.1
          APP_PORT: 8011
          PYTHONPATH: src
        run: |
          python -m uvicorn agentic_ai.app:app --host 127.0.0.1 --port 8011 &
          echo $! > uvicorn.pid
          sleep 4
      - name: Verify health endpoint
        run: curl -f http://127.0.0.1:8011/health
      - name: Verify static UI pages
        run: |
          set -eux
          curl -f http://127.0.0.1:8011/ | head -n 5
          curl -f http://127.0.0.1:8011/coding | head -n 5
          curl -f http://127.0.0.1:8011/coding/app.js | head -n 2
          curl -f http://127.0.0.1:8011/rag | head -n 5
          curl -f http://127.0.0.1:8011/rag/app.js | head -n 2
      - name: Stop API
        if: always()
        run: kill $(cat uvicorn.pid) || true

  mcp-tests:
    name: MCP server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run MCP tests
        env:
          MODEL_PROVIDER: openai
          OPENAI_API_KEY: "ci"
          PYTHONPATH: src
        run: pytest tests/test_mcp_server.py -q --tb=short
