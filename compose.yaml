services:
  # ---------- Main API ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-ai:latest
    container_name: agentic-ai
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CHROMA_DIR: /data/chroma
      SQLITE_PATH: /data/sqlite/agent.db
      LOG_DIR: /app/.logs
    volumes:
      - app-logs:/app/.logs
      - chroma-data:/data/chroma
      - sqlite-data:/data/sqlite
      - ./data/seed:/app/data/seed:ro
      - ./data/agent_output:/app/data/agent_output
      - ./data/emails:/app/data/emails
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  # ---------- MCP Server ----------
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-ai:latest
    container_name: agentic-ai-mcp
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CHROMA_DIR: /data/chroma
      SQLITE_PATH: /data/sqlite/agent.db
    volumes:
      - chroma-data:/data/chroma
      - sqlite-data:/data/sqlite
      - ./data/agent_output:/app/data/agent_output
    ports:
      - "${MCP_PORT:-8001}:8001"
    command: >
      python -m uvicorn mcp.server:create_app --factory
      --host 0.0.0.0 --port 8001 --log-level info
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/status"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    depends_on:
      app:
        condition: service_healthy

volumes:
  app-logs:
  chroma-data:
  sqlite-data:
