name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - name: Ruff check
        run: ruff check src tests mcp
      - name: Ruff format check
        run: ruff format --check src tests mcp

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libxml2-dev libxslt1-dev

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          MODEL_PROVIDER: openai
          OPENAI_API_KEY: "not-needed-for-tests"
          CHROMA_DIR: .chroma
          SQLITE_PATH: .sqlite/agent.db
          PYTHONPATH: src
        run: |
          mkdir -p reports
          pytest -q --tb=short --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python-version }}
          path: reports/junit.xml

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-py${{ matrix.python-version }}
          path: .logs/

  docker-build:
    name: "\U0001F433 Docker build + smoke test"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agentic-ai:ci --target runtime .

      - name: Smoke-test container health
        run: |
          docker run -d --name smoke \
            -e MODEL_PROVIDER=openai \
            -e OPENAI_API_KEY=ci-test \
            -e PYTHONPATH=/app/src \
            -p 8000:8000 \
            agentic-ai:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo " Health OK"
              break
            fi
            sleep 2
          done
          curl -f http://127.0.0.1:8000/health
          docker stop smoke

  docker-ghcr:
    name: "\U0001F433 Push to GHCR"
    needs: [docker-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentic-ai:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/agentic-ai:latest
