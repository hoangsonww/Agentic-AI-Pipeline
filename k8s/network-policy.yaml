# =============================================================================
# Network Policy — Agentic AI
# Restricts traffic to only what the application needs.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentic-ai-network-policy
  labels:
    app: agentic-ai
spec:
  podSelector:
    matchLabels:
      app: agentic-ai
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow traffic from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8001

    # Allow traffic from within the same app (app <-> mcp)
    - from:
        - podSelector:
            matchLabels:
              app: agentic-ai
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8001

    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000

  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow HTTPS outbound (LLM APIs, web search)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
