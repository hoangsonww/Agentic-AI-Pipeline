name: runledger-gate
on:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal deps for eval adapter
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pydantic>=2.8.0" \
            "pydantic-settings>=2.3.4" \
            "python-dotenv>=1.0.1" \
            "langchain>=0.2.14" \
            "langgraph>=0.2.27" \
            "langchain-openai>=0.2.0" \
            "langchain-anthropic>=0.2.0"
      - name: Run RunLedger (replay)
        uses: runledger/Runledger@v0.1
        with:
          path: evals/runledger
          mode: replay
          python-version: "3.11"
